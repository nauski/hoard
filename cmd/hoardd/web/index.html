<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hoard — backup control</title>
<script>(function(){try{var s=localStorage.getItem('hoard-theme');var t=s||((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#8b949e; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff; --accent-fg:#0d1117; --sunken:#0d1117; --term-bg:#010409; --term-fg:#c9d1d9; }
  :root[data-theme="light"] { color-scheme: light; --bg:#f6f8fa; --panel:#ffffff; --line:#d0d7de; --fg:#1f2328; --muted:#656d76; --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; --accent:#0969da; --accent-fg:#ffffff; --sunken:#eff2f5; --term-bg:#0d1117; --term-fg:#e6edf3; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header .repo { color:var(--muted); font-size:12px; margin-left:auto; text-align:right; }
  .themebtn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:15px;line-height:1}
  main { padding:24px; max-width:1100px; margin:0 auto; display:grid; gap:20px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 10px; }
  .metric { font-size:22px; font-weight:600; }
  .sub { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .b-ok { background:rgba(63,185,80,.15); color:var(--ok); }
  .b-bad { background:rgba(248,81,73,.15); color:var(--bad); }
  .b-warn { background:rgba(210,153,34,.15); color:var(--warn); }
  .b-idle { background:rgba(139,148,158,.15); color:var(--muted); }
  button { background:var(--accent); color:var(--accent-fg); border:0; border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .actions { display:flex; gap:10px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .foot { color:var(--muted); font-size:12px; text-align:center; padding-bottom:24px; }
  a { color:var(--accent); }
  select { background:var(--sunken); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .vrow,.frow { display:flex; align-items:center; gap:10px; padding:7px 10px; border-bottom:1px solid var(--line); }
  .vrow:hover,.frow:hover { background:var(--sunken); }
  .frow .nm,.vrow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:2px 8px; font-size:12px; font-weight:500; }
  .mini.danger { border-color:rgba(248,81,73,.5); color:var(--bad); }
  .mini.act { border-color:var(--accent); color:var(--accent); }
  .crumb { flex:1; background:var(--sunken); border:1px solid var(--line); border-radius:8px; color:var(--fg); padding:6px 9px; font-family:ui-monospace,monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,92vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .modal .mhead{padding:14px 16px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:14px}
  .modal .mbody{padding:16px;overflow-y:auto}
  .modal .mbody label{display:flex;gap:8px;align-items:flex-start;padding:8px 0;cursor:pointer}
  .modal input[type=text]{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font-family:ui-monospace,monospace;font-size:13px;margin-top:6px}
  .mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}
  .warn{color:var(--warn)} .danger-text{color:var(--bad)}
  .rclient{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
  .rclient h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:10px}
  .pbar{height:9px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,#3fb950,#58a6ff);transition:width .4s ease}
  .pstats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pstats b{color:var(--fg)}
  .ctrls{display:flex;gap:8px;margin:10px 0 4px;align-items:center}
  .mini2{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .mini2.danger{border-color:rgba(248,81,73,.5);color:var(--bad)}
  .term{background:var(--term-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;height:220px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--term-fg);margin-top:10px}
  .term .a-new{color:#3fb950}.term .a-changed{color:#d29922}.term .a-unchanged{color:#6e7681}.term .a-error{color:#f85149}.term .a-meta{color:#58a6ff}
</style>
</head>
<body>
<header>
  <h1>🗄️ hoard</h1>
  <span id="running" class="badge b-idle">idle</span>
  <div class="repo">
    <div>hot: <span id="hotRepo" class="mono">—</span> <b id="hotSize"></b></div>
    <div>cold: <span id="coldRepo" class="mono">—</span> <b id="coldSize"></b></div>
  </div>
  <button id="themeToggle" class="themebtn" onclick="toggleTheme()" title="Toggle light / dark">🌙</button>
</header>

<main>
  <div class="row" id="jobCards"></div>

  <div class="card" id="runningCard" style="display:none">
    <h2>Running backups</h2>
    <div id="runningList"></div>
  </div>

  <div class="card">
    <h2>Clients</h2>
    <table>
      <thead><tr><th>Host</th><th>Last snapshot</th><th>Age</th><th>Paths</th><th>State</th></tr></thead>
      <tbody id="clients"><tr><td colspan="5" class="sub">loading…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Actions</h2>
    <div class="actions">
      <button id="btnMirror">Mirror to e2 now</button>
      <button id="btnCheck" class="secondary">Verify integrity</button>
    </div>
    <p class="sub" id="actionMsg"></p>
  </div>

  <div class="card">
    <h2>Backup browser</h2>
    <div class="bar">
      <label class="sub">Client:</label>
      <select id="bClient" onchange="selectClient(this.value)"><option value="">— select a client —</option></select>
      <span class="sub" id="bHint">pick a client to see its backup versions</span>
    </div>
    <div id="bVersions" style="margin-top:14px"></div>
    <div id="bFiles" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2>Recent jobs</h2>
    <table>
      <thead><tr><th>Job</th><th>When</th><th>Duration</th><th>Result</th><th>Message</th></tr></thead>
      <tbody id="history"><tr><td colspan="5" class="sub">loading…</td></tr></tbody>
    </table>
  </div>

  <div class="foot">hoard · auto-refreshes every 5s</div>
</main>

<div id="delBg" class="modal-bg">
  <div class="modal">
    <div class="mhead"><h3>🗑 Delete file</h3></div>
    <div class="mbody">
      <div class="mono sub" id="delPath">—</div>
      <div style="margin-top:12px">
        <label><input type="radio" name="delscope" value="version" checked onchange="onScope()"> <span>From <b>this version only</b> — the file stays in other snapshots.</span></label>
        <label><input type="radio" name="delscope" value="all" onchange="onScope()"> <span>From <b class="danger-text">ALL versions</b> — permanently removes it everywhere (hot + e2) and reclaims space. <b class="danger-text">Cannot be undone.</b></span></label>
      </div>
      <div id="delConfirmWrap" style="display:none;margin-top:10px">
        <span class="sub">Type the filename <b class="mono" id="delConfirmName"></b> to confirm:</span>
        <input id="delConfirm" type="text" oninput="onConfirmType()" placeholder="filename" />
      </div>
    </div>
    <div class="mfoot">
      <span class="sub" id="delMsg"></span>
      <div class="bar">
        <button class="secondary" onclick="closeDel()">Cancel</button>
        <button id="delGo" onclick="doDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// theme toggle (initial theme is set by the inline <head> script to avoid flash)
function themeIcon(){ const b=document.getElementById('themeToggle'); if(b) b.textContent=document.documentElement.getAttribute('data-theme')==='light'?'☀️':'🌙'; }
function toggleTheme(){ const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme',next); try{localStorage.setItem('hoard-theme',next);}catch(e){} themeIcon(); }
themeIcon();
const fmt = t => t ? new Date(t).toLocaleString() : "never";
const zero = "0001-01-01T00:00:00Z";
function age(t){
  if(!t || t.startsWith("0001")) return "—";
  const s = Math.max(0,(Date.now()-new Date(t))/1000);
  if(s<3600) return Math.round(s/60)+"m";
  if(s<86400) return (s/3600).toFixed(1)+"h";
  return (s/86400).toFixed(1)+"d";
}
function badge(ok){ return ok ? '<span class="badge b-ok">ok</span>' : '<span class="badge b-bad">failed</span>'; }

async function refresh(){
  try{
    const st = await (await fetch("/api/status")).json();
    $("#hotRepo").textContent = st.hot_repo || "—";
    $("#coldRepo").textContent = st.cold_repo || "—";
    const run = st.running || "";
    const r = $("#running");
    r.textContent = run || "idle";
    r.className = "badge " + (run ? "b-warn" : "b-idle");
    $("#btnMirror").disabled = !!run;
    $("#btnCheck").disabled = !!run;

    const jobs = st.jobs || {};
    const order = ["mirror","check","prune"];
    $("#jobCards").innerHTML = order.map(j=>{
      const job = jobs[j];
      const state = job ? (job.ok?'b-ok':'b-bad') : 'b-idle';
      const label = job ? (job.ok?'ok':'failed') : 'never run';
      return `<div class="card"><h2>${j}</h2>
        <div class="metric"><span class="badge ${state}">${label}</span></div>
        <div class="sub">${job?fmt(job.ended_at):"—"}</div></div>`;
    }).join("");

    const clients = st.clients || {};
    const keys = Object.keys(clients).sort();
    $("#clients").innerHTML = keys.length ? keys.map(k=>{
      const c = clients[k];
      const st2 = c.stale ? '<span class="badge b-bad">stale</span>' : '<span class="badge b-ok">fresh</span>';
      return `<tr><td class="mono">${c.hostname}</td><td>${fmt(c.last_snapshot)}</td>
        <td>${age(c.last_snapshot)}</td><td class="sub mono">${(c.paths||[]).join(", ")}</td><td>${st2}</td></tr>`;
    }).join("") : '<tr><td colspan="5" class="sub">no client snapshots yet</td></tr>';
  }catch(e){ /* transient */ }

  try{
    const hist = await (await fetch("/api/history")).json();
    const rows = (hist||[]).slice(-15).reverse();
    $("#history").innerHTML = rows.length ? rows.map(h=>{
      const dur = ((new Date(h.ended_at)-new Date(h.started_at))/1000).toFixed(1)+"s";
      return `<tr><td>${h.job}</td><td>${fmt(h.started_at)}</td><td>${dur}</td>
        <td>${badge(h.ok)}</td><td class="sub">${(h.message||"").slice(0,80)}</td></tr>`;
    }).join("") : '<tr><td colspan="5" class="sub">no jobs recorded</td></tr>';
  }catch(e){}
}

async function trigger(job){
  $("#actionMsg").textContent = "starting "+job+"…";
  const res = await fetch("/api/actions/"+job, {method:"POST"});
  const j = await res.json();
  $("#actionMsg").textContent = res.ok ? (job+" started") : ("error: "+(j.error||res.status));
  setTimeout(refresh, 500);
}
$("#btnMirror").onclick = ()=>trigger("mirror");
$("#btnCheck").onclick = ()=>trigger("check");

refresh();
setInterval(refresh, 5000);

// ---------------- Backup browser ----------------
function hBytes(b){b=b||0;if(b<1024)return b+" B";const u=["KiB","MiB","GiB","TiB","PiB"];let i=-1;do{b/=1024;i++}while(b>=1024&&i<u.length-1);return b.toFixed(1)+" "+u[i];}
let bClientHost="", bSnaps=[], bSnap="", bDir="/", delCtx={};
// short_ids optimistically deleted — filtered out of every reload until the
// server confirms they're actually gone, so no refresh can resurrect a row.
let pendingDel=new Set();

async function loadClients(){
  try{
    const st=await (await fetch("/api/status")).json();
    const hosts=Object.keys(st.clients||{}).sort();
    const sel=$("#bClient"); const cur=sel.value;
    sel.innerHTML='<option value="">— select a client —</option>'+hosts.map(h=>`<option value="${h}">${h}</option>`).join("");
    if(hosts.includes(cur)) sel.value=cur;
  }catch(e){}
}
async function selectClient(host, keepFiles){
  bClientHost=host; if(!keepFiles){ bSnap=""; $("#bFiles").innerHTML=""; }
  if(!host){ $("#bVersions").innerHTML=""; $("#bHint").textContent="pick a client to see its backup versions"; return; }
  $("#bHint").textContent="";
  let all;
  try { const r=await fetch("/api/snapshots"); all=await r.json(); if(!r.ok) throw 0; }
  catch(e){ return; } // transient (e.g. repo busy): keep the current list, don't blank
  if(!Array.isArray(all)) return;
  bSnaps=all.filter(s=>s.hostname===host && !pendingDel.has(s.short_id)).sort((a,b)=>new Date(b.time)-new Date(a.time));
  renderVersions();
}
// Poll until the server is idle (delete/purge job finished), then reconcile the
// list with the true server state. keepFiles preserves the open file view.
async function waitIdleThenReload(keepFiles){
  for(let i=0;i<60;i++){
    try{ const st=await (await fetch("/api/status")).json(); if(!st.running){ break; } }catch(e){}
    await new Promise(r=>setTimeout(r,1000));
  }
  await selectClient(bClientHost, keepFiles);
}
function renderVersions(){
  if(!bSnaps.length){ $("#bVersions").innerHTML='<div class="sub">no versions for this client</div>'; return; }
  $("#bVersions").innerHTML='<div class="sub" style="margin-bottom:6px">'+bSnaps.length+' version(s):</div>'+bSnaps.map(s=>{
    const sel = s.short_id===bSnap ? 'style="background:var(--sunken)"' : '';
    const sz = s.summary ? hBytes(s.summary.total_bytes_processed) : "—";
    const added = s.summary && s.summary.data_added ? " <span class='sub'>(+"+hBytes(s.summary.data_added)+" new)</span>" : "";
    return `<div class="vrow" ${sel}>
      <span class="nm"><span class="mono">${s.short_id}</span> · ${fmt(s.time)} · <b>${sz}</b>${added} <span class="sub">${(s.paths||[]).join(", ")}</span></span>
      <button class="mini act" onclick="browseVersion('${s.short_id}')">Browse</button>
      <button class="mini danger" onclick="deleteVersion('${s.short_id}')">Delete version</button>
    </div>`;
  }).join("");
}
let bEntries=[];
async function browseVersion(id){ bSnap=id; bDir="/"; renderVersions(); await browseDir("/"); }
async function browseDir(dir){
  bDir=dir;
  const r=await fetch("/api/ls?id="+encodeURIComponent(bSnap)+"&path="+encodeURIComponent(dir));
  const entries=await r.json();
  if(!r.ok){ $("#bFiles").innerHTML='<div class="sub">'+(entries.error||"error")+'</div>'; return; }
  bEntries = Array.isArray(entries) ? entries : [];
  renderFiles();
}
function renderFiles(){
  const up = bDir!=="/" ? `<button class="mini" onclick="browseDir('${parentDir(bDir).replace(/'/g,"\\'")}')">↑ up</button>` : "";
  const rows=bEntries.map(e=>{
    if(e.type==="dir"){
      return `<div class="frow"><span class="nm" style="cursor:pointer" onclick="browseDir('${e.path.replace(/'/g,"\\'")}')">📁 ${e.name}</span></div>`;
    }
    return `<div class="frow"><span class="nm">📄 ${e.name} <span class="sub">${hBytes(e.size)}</span></span>
      <a class="mini act" href="/api/download?id=${encodeURIComponent(bSnap)}&path=${encodeURIComponent(e.path)}">⬇ download</a>
      <button class="mini danger" onclick='openDel(${JSON.stringify(e.path)},${JSON.stringify(e.name)})'>🗑 delete</button></div>`;
  }).join("");
  $("#bFiles").innerHTML=`<div class="bar" style="margin-bottom:8px">${up}<span class="crumb">${bDir}</span><span class="sub mono">${bSnap}</span></div>`+
    (rows||'<div class="sub">empty folder</div>');
}
function parentDir(d){ const i=d.replace(/\/+$/,"").lastIndexOf("/"); return i<=0?"/":d.slice(0,i); }

function deleteVersion(id){
  if(!confirm("Delete the ENTIRE version "+id+" (this snapshot) from hot + e2?\nOther versions are unaffected.")) return;
  // Optimistic: drop the row now and mark it pending so no reload can bring it
  // back; reconcile once the server confirms it's gone.
  pendingDel.add(id);
  bSnaps=bSnaps.filter(s=>s.short_id!==id); renderVersions();
  if(bSnap===id){ bSnap=""; bEntries=[]; $("#bFiles").innerHTML=""; }
  fetch("/api/delete-version",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})})
    .then(r=>{ if(!r.ok) throw 0; toast("deleting version "+id+"… (reclaiming space in the background)"); reconcileDeleted(id); })
    .catch(()=>{ pendingDel.delete(id); toast("delete failed — restoring list"); selectClient(bClientHost); });
}
// Poll the real snapshot list until the id is actually gone (delete applied),
// then stop filtering it. Bounded so a failed delete doesn't hide it forever.
async function reconcileDeleted(id){
  for(let i=0;i<45;i++){
    await new Promise(r=>setTimeout(r,1000));
    let all; try{ const r=await fetch("/api/snapshots"); all=await r.json(); if(!r.ok||!Array.isArray(all)) continue; }catch(e){ continue; }
    if(!all.some(s=>s.short_id===id)){ break; } // confirmed gone
  }
  pendingDel.delete(id);
  selectClient(bClientHost, true);
}

// ---- file delete modal ----
function openDel(path,name){ delCtx={path,name}; $("#delPath").textContent=path; $("#delConfirmName").textContent=name;
  document.querySelector('input[name=delscope][value=version]').checked=true; $("#delConfirm").value=""; onScope(); $("#delMsg").textContent="";
  $("#delBg").style.display="flex"; }
function closeDel(){ $("#delBg").style.display="none"; }
function scope(){ return document.querySelector('input[name=delscope]:checked').value; }
function onScope(){ const all=scope()==="all"; $("#delConfirmWrap").style.display=all?"block":"none"; onConfirmType(); }
function onConfirmType(){
  const all=scope()==="all";
  $("#delGo").disabled = all && $("#delConfirm").value!==delCtx.name;
}
async function doDelete(){
  const all=scope()==="all";
  const body={ path:delCtx.path, host:bClientHost };
  if(!all) body.version=bSnap;
  $("#delMsg").textContent="deleting…"; $("#delGo").disabled=true;
  const path=delCtx.path;
  // Optimistic: remove the file row now, keep the folder open.
  bEntries=bEntries.filter(e=>e.path!==path); renderFiles();
  const r=await fetch("/api/purge",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.ok){ closeDel(); toast(all?"purging from all versions… (reclaiming space in the background)":"removing from this version…");
    // rewrite changes snapshot IDs; reconcile the version list without disturbing the open folder.
    waitIdleThenReload(true); }
  else { const j=await r.json(); $("#delMsg").textContent="error: "+(j.error||r.status); $("#delGo").disabled=false; browseDir(bDir); }
}
function toast(m){ const el=$("#bHint"); el.textContent=m; setTimeout(()=>{ if(bClientHost) el.textContent=""; },4000); }

loadClients();
setInterval(loadClients, 8000);

// Repository storage totals (deduplicated). Fetched infrequently — stats reads
// the index and cold hits e2.
async function loadStats(){
  try{
    const st=await (await fetch("/api/stats")).json();
    if(st.hot) $("#hotSize").textContent="· "+hBytes(st.hot.total_size);
    if(st.cold) $("#coldSize").textContent="· "+hBytes(st.cold.total_size);
  }catch(e){}
}
loadStats();
setInterval(loadStats, 60000);

// ---------------- Running backups (all clients) ----------------
function hDur(s){s=Math.max(0,Math.round(s||0));if(s<60)return s+"s";const m=Math.floor(s/60),ss=s%60;if(m<60)return m+"m "+ss+"s";const h=Math.floor(m/60);return h+"h "+(m%60)+"m";}
function actionClass(line){const a=(line.split(/\s+/)[0]||"").toLowerCase();
  if(a==="new")return"a-new";if(a==="changed")return"a-changed";if(a==="unchanged"||a==="unmodified")return"a-unchanged";
  if(a==="error")return"a-error";if(line.startsWith("—"))return"a-meta";return"";}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
async function rctrl(host,action){
  await fetch("/api/clients/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({host,action})});
  setTimeout(loadRunning,400);
}
function paintTerm(host,lines){
  const term=document.getElementById("term-"+host); if(!term) return;
  const sig=lines.length+"|"+(lines[lines.length-1]||"");
  if(term.dataset.sig===sig) return; // content signature: length alone freezes when the ring buffer is full
  const atBottom=term.scrollHeight-term.scrollTop-term.clientHeight<40;
  term.innerHTML=lines.map(l=>`<div class="${actionClass(l)}">${esc(l)}</div>`).join("");
  term.dataset.sig=sig;
  if(atBottom) term.scrollTop=term.scrollHeight;
}
async function loadRunning(){
  let list;
  try{ list=await (await fetch("/api/running")).json(); }catch(e){ return; }
  const active=(list||[]).filter(c=>c.live && c.live.running);
  const card=$("#runningCard");
  if(!active.length){ card.style.display="none"; $("#runningList").innerHTML=""; return; }
  card.style.display="";
  const have=new Set(active.map(c=>c.host));
  // build/refresh a panel per host
  active.sort((a,b)=>a.host<b.host?-1:1).forEach(c=>{
    const L=c.live, p=L.progress||{}, pct=Math.round((p.percent_done||0)*100);
    let el=document.getElementById("rc-"+c.host);
    if(!el){
      el=document.createElement("div"); el.className="rclient"; el.id="rc-"+c.host;
      el.innerHTML=`<h3><span class="mono" id="rh-${c.host}"></span> <span class="badge" id="rb-${c.host}"></span></h3>
        <div class="pbar"><div class="pfill" id="rf-${c.host}"></div></div>
        <div class="pstats"><span><b id="rp-${c.host}">0%</b> done</span><span>files <b id="rfl-${c.host}">0/0</b></span>
          <span>data <b id="rby-${c.host}">0/0</b></span><span>elapsed <b id="rel-${c.host}">0s</b></span><span>ETA <b id="ret-${c.host}">—</b></span></div>
        <div class="ctrls">
          <button class="mini2" id="rpause-${c.host}" onclick="rctrl('${c.host}','pause')">⏸ Pause</button>
          <button class="mini2" id="rresume-${c.host}" style="display:none" onclick="rctrl('${c.host}','resume')">▶ Resume</button>
          <button class="mini2 danger" onclick="rctrl('${c.host}','cancel')">✕ Cancel</button>
        </div>
        <div class="term" id="term-${c.host}"></div>`;
      $("#runningList").appendChild(el);
    }
    $("#rh-"+c.host).textContent=c.host;
    const badge=$("#rb-"+c.host); badge.textContent=L.paused?"paused":"backing up"; badge.className="badge "+(L.paused?"b-warn":"b-ok");
    const f=$("#rf-"+c.host); f.style.width=pct+"%"; f.style.opacity=L.paused?0.5:1;
    $("#rp-"+c.host).textContent=pct+"%";
    $("#rfl-"+c.host).textContent=(p.files_done||0)+" / "+(p.total_files||0);
    $("#rby-"+c.host).textContent=hBytes(p.bytes_done)+" / "+hBytes(p.total_bytes);
    $("#rel-"+c.host).textContent=hDur(p.seconds_elapsed);
    $("#ret-"+c.host).textContent=p.seconds_remaining>0?hDur(p.seconds_remaining):"—";
    $("#rpause-"+c.host).style.display=L.paused?"none":"";
    $("#rresume-"+c.host).style.display=L.paused?"":"none";
    paintTerm(c.host, L.activity||[]);
  });
  // remove panels for hosts no longer running
  [...$("#runningList").children].forEach(el=>{ const h=el.id.slice(3); if(!have.has(h)) el.remove(); });
}
loadRunning();
setInterval(loadRunning, 1500);
</script>
</body>
</html>
